disableStartupPopups: true
notARepository: "skip"
os:
  editPreset: "nvim-remote"
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "<CMD>lua Snacks.lazygit()<CR>" && nvim --server "$NVIM" --remote-tab {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "<CMD>lua Snacks.lazygit()<CR>" &&  nvim --server "$NVIM" --remote-tab {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
gui:
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  theme:
    selectedLineBgColor:
      - reverse
    selectedRangeBgColor:
      - reverse
    authorColors:
      "Jakub Reroń": "green"
      "Jakub Reron": "green"
      "jakubreron": "green"
      "jakub.reron": "green"
      "jr": "green"
      "JR": "green"
      "ヤ": "green"
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
