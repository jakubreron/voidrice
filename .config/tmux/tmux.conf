set-option -ga terminal-overrides ',xterm-256color:Tc'
set-option -ga terminal-overrides ",alacritty:RGB"

set-option -g escape-time 0
set-option -g status-keys emacs
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g mouse on
set-option -g pane-border-lines heavy
set-option -g renumber-windows on

# NOTE: -r = repeatable
bind-key -r H resize-pane -L 10
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 10
# NOTE: -T = key table, specify the copy-mode-vi, etc... 

set-option -g mode-keys vi
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy" # Copy & exit
bind-key -T copy-mode-vi 'p' send-keys -X copy-pipe-and-cancel "tmux paste-buffer"

# don't scroll to the bottom when copying with mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

bind-key C-h if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key C-j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key C-k if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key C-l if-shell -F '#{pane_at_right}' '' 'select-pane -R'

set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'

set-option -g @plugin 'egel/tmux-gruvbox'
set-option -g @tmux-gruvbox 'light' # or 'light256', 'light', 'light256'
set-option -g @tmux-gruvbox-statusbar-alpha 'true'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.config/tmux/plugins/tpm/tpm'
